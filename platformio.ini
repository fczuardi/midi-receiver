[platformio]
default_envs = m5stick-cplus2

[env]
lib_deps =
  EmbeddedMusicFirmwareContracts=https://github.com/fczuardi/embedded-music-experiments.git#2577b866e6588044853faa8eb3dedab2c1f3952a

[env:m5stick-cplus2]
platform = platformio/espressif32@7.0.1
board = m5stick-cplus2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
  ${env.lib_deps}
  m5stack/M5Unified@0.2.17
  lathoub/BLE-MIDI@2.2
lib_ignore =
  ArduinoBLE
  Arduino_SpiNINA
  NimBLE-Arduino

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter =
  -<*>
  +<ActiveNotes.cpp>
  +<AppState.cpp>
  +<MidiNoteName.cpp>
  +<MidiNoteEventFactory.cpp>
