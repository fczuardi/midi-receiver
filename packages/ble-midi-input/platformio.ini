[platformio]
core_dir = ../../../.platformio-home
default_envs = native

[env]
lib_deps =
  firmware-contracts=https://github.com/fczuardi/embedded-music-experiments.git#c62653e916bb

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter =
  -<*>
  +<BleMidiPacketDecoder.cpp>
  +<MidiMessageParser.cpp>
  +<PendingMidiEventQueue.cpp>
  +<MidiNoteEventFactory.cpp>
