name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  PLATFORMIO_CORE_DIR: ../.platformio-home

jobs:
  firmware-build:
    name: Firmware build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ../.platformio-home
          key: platformio-${{ runner.os }}-${{ hashFiles('packages/ble-midi-input/platformio.ini', 'packages/ble-midi-input/library.json', 'apps/ble-midi-receiver-local-test/platformio.ini', 'apps/ble-midi-receiver-local-test/boards/*.json', 'ci/consumers/ble-midi-input/platformio.ini', 'ci/consumers/ble-midi-input/src/main.cpp') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Run package native tests
        run: pio test -d packages/ble-midi-input -e native

      - name: Run app native tests
        run: pio test -d apps/ble-midi-receiver-local-test -e native

      - name: Build firmware
        run: pio run -d apps/ble-midi-receiver-local-test

      - name: Validate PlatformIO library package
        run: pio pkg pack packages/ble-midi-input --output /tmp

      - name: Build package consumer
        run: |
          package_version="$(python -c 'import json; print(json.load(open("packages/ble-midi-input/library.json", encoding="utf-8"))["version"])')"
          archive="/tmp/ble-midi-input-${package_version}.tar.gz"
          test -f "$archive"
          BLE_MIDI_INPUT_PACKAGE="file://$archive" pio run -d ci/consumers/ble-midi-input

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m5-ble-midi-receiver-firmware
          path: |
            apps/ble-midi-receiver-local-test/.pio/build/m5stick-cplus2/firmware.bin
            apps/ble-midi-receiver-local-test/.pio/build/m5stick-cplus2/bootloader.bin
            apps/ble-midi-receiver-local-test/.pio/build/m5stick-cplus2/partitions.bin
            apps/ble-midi-receiver-local-test/.pio/build/m5stack-core-gray/firmware.bin
            apps/ble-midi-receiver-local-test/.pio/build/m5stack-core-gray/bootloader.bin
            apps/ble-midi-receiver-local-test/.pio/build/m5stack-core-gray/partitions.bin
          if-no-files-found: error
