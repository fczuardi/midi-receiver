name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  PLATFORMIO_CORE_DIR: .platformio-home

jobs:
  firmware-build:
    name: Firmware build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: .platformio-home
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/*.json') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Run native unit tests
        run: pio test -e native

      - name: Build firmware
        run: pio run

      - name: Validate PlatformIO library package
        run: pio pkg pack . --output /tmp

      - name: Build temporary package consumer
        run: |
          mkdir -p /tmp/ble-midi-input-consumer/src
          cat > /tmp/ble-midi-input-consumer/platformio.ini <<'EOF'
          [env:esp32dev]
          platform = platformio/espressif32@7.0.1
          board = esp32dev
          framework = arduino
          lib_deps =
            file://${{ github.workspace }}
            EmbeddedMusicFirmwareContracts=https://github.com/fczuardi/embedded-music-experiments.git#154035d94df99ab05c3eeb7eb144bf2012972ada
          lib_ignore =
            ArduinoBLE
            Arduino_SpiNINA
            NimBLE-Arduino
          EOF
          cat > /tmp/ble-midi-input-consumer/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include "BleMidiInput.h"
          #include "PitchBendEvent.h"

          class CapturingInstrumentEventSink : public InstrumentEventSink {
          public:
            void onNoteEvent(const NoteEvent&) override {}
            void onPitchBendEvent(const PitchBendEvent&) override {}
            void onDisconnected() override {}
          };

          CapturingInstrumentEventSink sink;
          BleMidiInput input;

          void setup() {
            input.setInstrumentEventSink(&sink);
          }

          void loop() {
            input.update();
          }
          EOF
          pio run -d /tmp/ble-midi-input-consumer

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m5stick-cplus2-firmware
          path: |
            .pio/build/m5stick-cplus2/firmware.bin
            .pio/build/m5stick-cplus2/bootloader.bin
            .pio/build/m5stick-cplus2/partitions.bin
          if-no-files-found: error
